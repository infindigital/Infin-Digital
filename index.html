<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta
      name="description"
      content="INFIN Digital is a digital marketing and website development agency in Mangalore. Websites, e-commerce, SEO, Google Ads, Meta Ads and branding for businesses across Dakshina Kannada."
    />
    <title>Digital Marketing Agency in Mangalore | INFIN Digital</title>
    <link rel="canonical" href="https://www.infindigital.in/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#14130F" />
    <link rel="shortcut icon" type="image/svg+xml" href="/assets/imgs/template/logo/infin-logo.svg" />

    <!-- Static social tags. Link unfurlers do not execute JavaScript, so these
         must live here rather than only in the React PageMeta component. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="INFIN Digital" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Digital Marketing Agency in Mangalore | INFIN Digital" />
    <meta
      property="og:description"
      content="Websites, e-commerce, SEO, Google Ads, Meta Ads and branding for businesses across Mangalore and Dakshina Kannada."
    />
    <meta property="og:url" content="https://www.infindigital.in/" />
    <meta property="og:image" content="https://www.infindigital.in/assets/imgs/pages/img-28.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Digital Marketing Agency in Mangalore | INFIN Digital" />
    <meta
      name="twitter:description"
      content="Websites, e-commerce, SEO, Google Ads, Meta Ads and branding for businesses across Mangalore and Dakshina Kannada."
    />
    <meta name="twitter:image" content="https://www.infindigital.in/assets/imgs/pages/img-28.webp" />

    <!-- Google Fonts: Space Grotesk (headings) + Sora (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />

    <!-- Vendor CSS (keep paths identical to HTML build) -->
    <link rel="stylesheet" href="/assets/css/vendors/carouselTicker.css" />
    <link rel="stylesheet" href="/assets/css/vendors/bootstrap.min.css" />
    <link rel="stylesheet" href="/assets/css/vendors/swiper-bundle.min.css" />
    <link rel="stylesheet" href="/assets/css/vendors/nice-select.css" />
    <link rel="stylesheet" href="/assets/css/vendors/font-awesome-pro.css" />
    <link rel="stylesheet" href="/assets/css/vendors/magnific-popup.css" />
    <link rel="stylesheet" href="/assets/css/vendors/odometer.css" />
    <link rel="stylesheet" href="/assets/css/vendors/spacing.css" />

    <!-- Main CSS -->
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/sticky-cards.css" />
    <link rel="stylesheet" href="/assets/css/custom.css" />

    <!-- Theme init before paint -->
    <script src="/scripts/theme-init.js"></script>
  </head>
  <body class="at-magic-cursor">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
